<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="NEMI AI" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph - site-wide constants (title/desc/url overridden per-page via Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEMI AI" />
    <meta property="og:image" content="https://nemi-ai.com/Images/nemi%2001.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card - site-wide constants -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NEMIai" />
    <meta name="twitter:image" content="https://nemi-ai.com/Images/nemi%2001.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <!-- JSON-LD: Organization (site-wide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NEMI AI",
      "url": "https://nemi-ai.com",
      "logo": "https://nemi-ai.com/Images/nemi%2001.png",
      "description": "NEMI AI is a full-stack, end-to-end manufacturing automation platform powered by Physical AI. Design, manufacture, and deploy physical products under one Large Manufacturing Model (LMM).",
      "foundingLocation": { "@type": "Place", "name": "Bangalore, India" },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "NEMI Manufacturing Services",
        "itemListElement": [
          { "@type": "Offer", "name": "Tooling & Fixturing", "description": "Injection moulding, die casting, press tools, fixtures." },
          { "@type": "Offer", "name": "Metal Parts Manufacturing", "description": "Cutting, bending, forming, welding, machining, casting, forging." },
          { "@type": "Offer", "name": "Battery Manufacturing", "description": "Portable chargers to drones to EVs to industrial energy storage." },
          { "@type": "Offer", "name": "Motor Manufacturing", "description": "Design and manufacturing of BLDC, Axial Flux and other motors." },
          { "@type": "Offer", "name": "Electronics Production", "description": "PCB assemblies, box builds, system integration and testing." },
          { "@type": "Offer", "name": "Complex Assemblies", "description": "Multiple part types into complex assemblies for EVs, drones, robotics." }
        ]
      }
    }
    </script>

    <!-- JSON-LD: WebSite (site-wide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NEMI AI",
      "url": "https://nemi-ai.com"
    }
    </script>

    <!-- Per-page: title, description, canonical, og:title/desc/url, twitter:title/desc
         injected here by Helmet (SSR) or react-helmet-async (CSR) -->
    <!--app-head-->
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
